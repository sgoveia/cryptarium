# OpenSSL / libcrypto C API coverage.
id: c-openssl
version: 2
language: c
description: OpenSSL and libcrypto C cryptographic API calls.

rules:
  # --- RSA ---
  - id: c.openssl.rsa_generate_key_ex
    primitive: RSA
    assetType: algorithm
    functions: [keygen]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_generate_key_ex
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_generate_key_ex.html"

  - id: c.openssl.rsa_generate_key
    primitive: RSA
    assetType: algorithm
    functions: [keygen]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_generate_key
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_generate_key.html"

  - id: c.openssl.rsa_private_encrypt
    primitive: RSA
    assetType: algorithm
    functions: [encrypt, sign]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_private_encrypt
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_private_encrypt.html"

  - id: c.openssl.rsa_public_encrypt
    primitive: RSA
    assetType: algorithm
    functions: [encrypt]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_public_encrypt
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_public_encrypt.html"

  - id: c.openssl.rsa_private_decrypt
    primitive: RSA
    assetType: algorithm
    functions: [decrypt]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_private_decrypt
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_private_decrypt.html"

  - id: c.openssl.rsa_public_decrypt
    primitive: RSA
    assetType: algorithm
    functions: [decrypt, verify]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_public_decrypt
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_public_decrypt.html"

  - id: c.openssl.rsa_sign
    primitive: RSA
    assetType: algorithm
    functions: [sign]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_sign
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_sign.html"

  - id: c.openssl.rsa_verify
    primitive: RSA
    assetType: algorithm
    functions: [verify]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_verify
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_verify.html"

  - id: c.openssl.pem_read_bio_rsaprivatekey
    primitive: RSA
    assetType: key
    functions: [keygen]
    confidence: medium
    match:
      kind: call
      package: openssl
      symbol: PEM_read_bio_RSAPrivateKey
    references:
      - "https://www.openssl.org/docs/man3.0/man3/PEM_read_bio_PrivateKey.html"

  - id: c.openssl.pem_read_bio_rsapublickey
    primitive: RSA
    assetType: key
    functions: [keygen]
    confidence: medium
    match:
      kind: call
      package: openssl
      symbol: PEM_read_bio_RSAPublicKey
    references:
      - "https://www.openssl.org/docs/man3.0/man3/PEM_read_bio_PrivateKey.html"

