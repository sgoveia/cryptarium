  - id: c.openssl.evp_aes_128_gcm
    primitive: AES
    assetType: algorithm
    functions: [encrypt, decrypt]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: EVP_aes_128_gcm
    parameters:
      keySize: { value: 128 }
    references:
      - "https://www.openssl.org/docs/man3.0/man3/EVP_EncryptInit.html"

  - id: c.openssl.evp_aes_256_gcm
    primitive: AES
    assetType: algorithm
