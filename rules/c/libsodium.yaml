    primitive: EdDSA
    assetType: algorithm
    functions: [verify]
    confidence: high
    match:
      kind: call
      package: libsodium
      symbol: crypto_sign_open
    references:
      - "https://doc.libsodium.org/public-key_cryptography/public-key_signatures"

  - id: c.libsodium.crypto_box_keypair
