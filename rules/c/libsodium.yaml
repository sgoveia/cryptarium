# libsodium C API coverage.
id: c-libsodium
version: 1
language: c
description: libsodium cryptographic API calls.

rules:
  - id: c.libsodium.crypto_sign_keypair
    primitive: EdDSA
    assetType: algorithm
    functions: [keygen]
    confidence: high
    match:
      kind: call
      package: libsodium
      symbol: crypto_sign_keypair
    references:
      - "https://doc.libsodium.org/public-key_cryptography/public-key_signatures"

  - id: c.libsodium.crypto_sign_seed_keypair
    primitive: EdDSA
    assetType: algorithm
    functions: [keygen]
    confidence: high
    match:
      kind: call
      package: libsodium
      symbol: crypto_sign_seed_keypair
    references:
      - "https://doc.libsodium.org/public-key_cryptography/public-key_signatures"

  - id: c.libsodium.crypto_sign
    primitive: EdDSA
    assetType: algorithm
    functions: [sign]
    confidence: high
