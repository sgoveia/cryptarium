# mbedTLS C API coverage.
id: c-mbedtls
version: 1
language: c
description: mbedTLS cryptographic API calls.

rules:
  - id: c.mbedtls.rsa_gen_key
    primitive: RSA
    assetType: algorithm
    functions: [keygen]
    confidence: high
    match:
      kind: call
      package: mbedtls
      symbol: mbedtls_rsa_gen_key
    references:
      - "https://mbed-tls.readthedocs.io/en/latest/api/file/rsa_8h/"

