id: cpp-openssl
version: 1
language: cpp
description: OpenSSL C++ call sites (same symbols as C pack).

rules:
  - id: cpp.openssl.rsa_generate_key_ex
    primitive: RSA
    assetType: algorithm
    functions: [keygen]
    confidence: high
    match:
      kind: call
      package: openssl
      symbol: RSA_generate_key_ex
    references:
      - "https://www.openssl.org/docs/man3.0/man3/RSA_generate_key.html"
